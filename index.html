<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Illustration Cards</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0f1219;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; gap:40px; flex-wrap:wrap; padding:40px 20px;
  }
  .card{
    width:260px; height:380px;
    position:relative;
    display:flex; justify-content:center; align-items:flex-end;
    perspective:2500px; cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cover-image{ width:100%; height:100%; object-fit:cover; }
  .wrapper{
    transition: all 0.5s ease;
    position:absolute; width:100%; height:100%;
    z-index:-1; border-radius:20px; overflow:hidden;
    box-shadow:0 10px 20px rgba(0,0,0,0.5);
  }
  .card:hover .wrapper, .card.active .wrapper{
    transform: perspective(900px) translateY(-5%) rotateX(25deg) translateZ(0);
    box-shadow: 2px 35px 32px -8px rgba(0,0,0,0.85);
  }
  .wrapper::before, .wrapper::after{
    content:""; opacity:0; width:100%; transition: all 0.5s;
    position:absolute; left:0;
  }
  .wrapper::before{
    top:0; height:100%;
    background: linear-gradient(to top, transparent 46%, rgba(12,13,19,0.5) 68%, rgba(12,13,19,0.9) 97%);
  }
  .wrapper::after{
    bottom:0; height:80px; opacity:1;
    background: linear-gradient(to bottom, transparent 46%, rgba(12,13,19,0.5) 68%, rgba(12,13,19,0.9) 97%);
  }
  .card:hover .wrapper::before, .card.active .wrapper::before,
  .card:hover .wrapper::after, .card.active .wrapper::after{ opacity:1; }
  .card:hover .wrapper::after, .card.active .wrapper::after{ height:120px; }

  .title{
    width:100%; transition: transform 0.5s;
    text-align:center; position:absolute; bottom:12px; z-index:2;
    color:#ffd700; font-weight:900; letter-spacing:1px;
    text-shadow:0 2px 10px black; font-size:14px; padding:0 10px;
  }
  .character{
    width:110%; opacity:0; transition: all 0.5s;
    position:absolute; z-index:1; bottom:0; pointer-events:none;
  }
  .card:hover .character, .card.active .character{
    opacity:1; transform: translate3d(0%, -25%, 100px);
  }
  .card:hover .title, .card.active .title{
    transform: translate3d(0%, -50px, 100px);
  }
</style>
</head>
<body>

  <!-- CARD 1 - Foto 1 -->
  <div class="card">
    <div class="wrapper">
      <img src="foto1.jpeg" class="cover-image">
    </div>
    <div class="title">JEN </div>
    <img src="foto1.jpeg" class="character">
  </div>

  <!-- CARD 2 - Foto 2 -->
  <div class="card">
    <div class="wrapper">
      <img src="foto2.jpeg" class="cover-image">
    </div>
    <div class="title">A </div>
    <img src="foto2.jpeg" class="character">
  </div>

<script>
  const cards = document.querySelectorAll('.card');
  
  cards.forEach(card => {
    card.addEventListener('click', function(e){
      e.stopPropagation();
      // En movil, cierra las otras
      const isActive = card.classList.contains('active');
      cards.forEach(c => c.classList.remove('active'));
      if (!isActive) card.classList.add('active');
    });
  });

  // Toca fuera para cerrar
  document.addEventListener('click', () => {
    cards.forEach(c => c.classList.remove('active'));
  });
</script>

</body>
</html>
