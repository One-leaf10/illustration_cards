<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>illustration card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a12; display:flex; justify-content:center; align-items:center; min-height:100vh; gap:35px; flex-wrap:wrap; padding:40px 15px; font-family:sans-serif;}

  .card{
    width:270px; height:420px; position:relative; perspective:2500px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; border-radius:22px;
  }
  /* BORDE HOLOGRAFICO */
  .card::before{
    content:""; position:absolute; inset:-3px; border-radius:24px;
    background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff, #00ff88, #ff00ff);
    background-size:400% 400%; animation:holo 4s linear infinite; z-index:-2;
  }
  .card::after{
    content:""; position:absolute; inset:-3px; border-radius:24px;
    background: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    background-size:400% 400%; animation:holo 4s linear infinite;
    filter:blur(12px); opacity:0.7; z-index:-3;
  }
  @keyframes holo{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .wrapper{
    position:absolute; width:100%; height:100%; border-radius:20px; overflow:hidden;
    background:#1a1a2e; transition:0.5s; z-index:-1; 
  }
  .card:hover .wrapper, .card.active .wrapper{
    transform: perspective(900px) translateY(-6%) rotateX(20deg);
    box-shadow:0 25px 50px rgba(0,0,0,0.9);
  }
  .cover-image{width:100%; height:62%; object-fit:cover;}

  /* STATS */
  .stats{position:absolute; bottom:0; width:100%; height:38%; background:white; padding:10px 12px; display:flex; flex-direction:column; justify-content:space-between;}
  .stats-top{display:flex; justify-content:space-between; font-weight:900; font-size:13px;}
  .hp{color:#e60000;}
  .bar{height:7px; background:#eee; border-radius:10px; overflow:hidden; margin:2px 0;}
  .fill{height:100%; width:95%; background:linear-gradient(90deg,#ff5f6d,#ffc371);}
  .fill2{width:100%; background:linear-gradient(90deg,#8e2de2,#4a00e0);}
  .fill3{width:99%; background:linear-gradient(90deg,#00f260,#0575e6);}
  .row{display:flex; justify-content:space-between; font-size:10px; font-weight:700; color:#333;}
  .ability{background:#f3f0ff; border-radius:8px; padding:5px 7px; font-size:10px;}
  .ability b{color:#6c5ce7;}
  
  .character{width:108%; position:absolute; top:0; z-index:2; pointer-events:none; opacity:0; transition:0.5s;}
  .card:hover .character, .card.active .character{opacity:1; transform:translate3d(0%,-18%,80px); top:-25px;}
  .badge{position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.7); backdrop-filter:blur(5px); border:1px solid gold; color:gold; font-size:8px; font-weight:900; padding:4px 8px; border-radius:20px; z-index:3; letter-spacing:1px;}
</style>
</head>
<body>

<!-- CARD 1 -->
<div class="card">
  <div class="badge">HOLO • LEGENDARY • BFF</div>
  <div class="wrapper"><img src="foto1.jpeg" class="cover-image">
    <div class="stats">
      <div class="stats-top"><span>JEN</span><span class="hp">HP 999</span></div>
      <div><div class="row"><span>Amistad</span><span>100/100</span></div><div class="bar"><div class="fill2"></div></div></div>
      <div><div class="row"><span>Lealtad</span><span>★★★★★</span></div><div class="bar"><div class="fill"></div></div></div>
      <div><div class="row"><span>Risas</span><span>∞</span></div><div class="bar"><div class="fill3"></div></div></div>
      <div class="ability"><b>Habilidad:</b> Siempre Escucha - Activa a las 2am</div>
    </div>
  </div>
  <img src="foto1.png" class="character">
</div>

<!-- CARD 2 -->
<div class="card">
  <div class="badge">HOLO • RARE • ALLY</div>
  <div class="wrapper"><img src="foto2.jpeg" class="cover-image">
    <div class="stats">
      <div class="stats-top"><span>A</span><span class="hp">HP 1000</span></div>
      <div><div class="row"><span>Soporte</span><span>999+</span></div><div class="bar"><div class="fill2"></div></div></div>
      <div><div class="row"><span>Chisme lvl</span><span>MAX</span></div><div class="bar"><div class="fill"></div></div></div>
      <div><div class="row"><span>Tk</span><span>1000%</span></div><div class="bar"><div class="fill3"></div></div></div>
      <div class="ability"><b>Especial:</b> Abrazo que cura - Restaura HP</div>
    </div>
  </div>
  <img src="foto2.png" class="character">
</div>

<script>
  const cards=document.querySelectorAll('.card');
  cards.forEach(card=>{
    card.addEventListener('click',e=>{
      e.stopPropagation();
      const active=card.classList.contains('active');
      cards.forEach(c=>c.classList.remove('active'));
      if(!active) card.classList.add('active');
    });
  });
  document.addEventListener('click',()=>cards.forEach(c=>c.classList.remove('active')));
</script>
</body>
</html>
